<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMMERSIVE VOID // AR VR SHOWCASE</title>
    <style>
        :root {
            --bg-color: #050505;
            --accent-color: #ffffff;
            --text-muted: #666666;
            --font-main: 'JetBrains Mono', 'Space Grotesk', monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--accent-color);
            font-family: var(--font-main);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2rem;
            z-index: 10;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        h1 {
            font-size: 0.75rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            font-weight: 400;
        }

        .status {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        footer {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .controls-info {
            font-size: 0.65rem;
            color: var(--text-muted);
            line-height: 1.6;
        }

        #xr-buttons {
            pointer-events: auto;
            display: flex;
            gap: 1rem;
        }

        /* Loading Screen */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .loader-bar {
            width: 200px;
            height: 1px;
            background: #1a1a1a;
            position: relative;
            margin-bottom: 1rem;
        }

        .loader-progress {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 0%;
            background: var(--accent-color);
            transition: width 0.3s ease;
        }

        .loader-text {
            font-size: 0.65rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        /* Custom VR/AR Button Styles */
        button {
            background: none !important;
            border: 1px solid var(--accent-color) !important;
            color: var(--accent-color) !important;
            padding: 0.75rem 1.5rem !important;
            font-family: var(--font-main) !important;
            font-size: 0.65rem !important;
            text-transform: uppercase !important;
            letter-spacing: 0.2em !important;
            cursor: pointer !important;
            transition: all 0.3s ease !important;
            border-radius: 0 !important;
        }

        button:hover {
            background: var(--accent-color) !important;
            color: var(--bg-color) !important;
        }

        #webxr-container {
            position: absolute;
            bottom: 2rem;
            right: 2rem;
            z-index: 20;
        }
    </style>
</head>
<body>
    <div id="loading-screen">
        <div class="loader-bar"><div class="loader-progress" id="progress"></div></div>
        <div class="loader-text">INITIALIZING CONSCIOUSNESS</div>
    </div>

    <div id="webxr-container"></div>

    <script type="module" src="/app.js"></script>
</body>
</html>
